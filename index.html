<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>バクソクAI</title>
  <meta name="description" content="バクソクAI — 準備中">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111827;
      --muted: #6b7280;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f19;
        --fg: #f3f4f6;
        --muted: #9ca3af;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 8vw, 3.5rem);
      letter-spacing: 0.02em;
    }
    h1 span { color: var(--accent); }
    p { margin: 0; color: var(--muted); font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <h1>バクソク<span>AI</span></h1>
    <p>ただいま準備中です。</p>
  </main>
</body>
</html>
